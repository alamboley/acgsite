name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Droits nécessaires au déploiement Pages via OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, ctype
          tools: composer:v2
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: generator/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('generator/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Installation des dépendances (Twig)
        working-directory: generator
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader

      - name: Génération du site
        working-directory: generator
        run: php main.php

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
